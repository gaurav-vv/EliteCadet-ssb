name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  checks:
    name: Lint, types, unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration

  e2e:
    name: Build & end-to-end tests
    needs: checks
    runs-on: ubuntu-latest
    steps:
      # The middleware calls supabase.auth.getUser() on every request, so e2e
      # needs a reachable project. PRs from forks don't get secrets — skip
      # there with a notice instead of failing.
      - name: Check Supabase secrets
        id: secrets
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::notice::Supabase secrets not set; skipping build and e2e."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.available == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.available == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.secrets.outputs.available == 'true'
      - run: npm run build
        if: steps.secrets.outputs.available == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.secrets.outputs.available == 'true'
      - run: npm run test:e2e
        if: steps.secrets.outputs.available == 'true'
      - uses: actions/upload-artifact@v4
        if: failure() && steps.secrets.outputs.available == 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  database-and-worker:
    name: Database checks & AI worker tests
    runs-on: ubuntu-latest
    # Applies every migration to a throwaway Postgres, runs the RLS workflow
    # check (supabase/tests), then the AI worker's tests against that database.
    # The worker uses a fake model client: no API key, no cost.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: worker
      - name: Migrations + RLS workflow check
        run: supabase/tests/run-workflow-check.sh | tee workflow-check.log && grep -q "ALL CHECKS PASSED" workflow-check.log
      - run: npx tsc --noEmit -p .
        working-directory: worker
      - run: npx vitest run
        working-directory: worker
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ssb_workflow_check
